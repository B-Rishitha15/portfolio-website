<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Batchu Rishitha</title>
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-950 px-6 text-slate-300 antialiased">
    <div class="relative text-center">
        <div class="blob left-[-120px] top-[-60px] h-72 w-72 bg-indigo-600"></div>
        <div class="blob bottom-[-80px] right-[-100px] h-72 w-72 bg-cyan-500"></div>
        <div class="relative">
            <p class="text-8xl font-extrabold sm:text-9xl"><span class="gradient-text">404</span></p>
            <h1 class="mt-4 text-2xl font-bold text-white sm:text-3xl">Page not found</h1>
            <p class="mx-auto mt-3 max-w-md text-slate-400">
                The page you are looking for does not exist or may have been moved.
            </p>
            <a th:href="@{/}"
               class="mt-8 inline-block rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 px-7 py-3 font-semibold text-white shadow-lg shadow-indigo-500/30 transition hover:scale-105">
                Back to Home
            </a>
        </div>
    </div>
</body>
</html>
